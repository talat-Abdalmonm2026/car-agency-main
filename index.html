<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Loan Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">AutoCalc</div>
    <nav>
      <a href="#calculator">Calculator</a>
    </nav>
  </header>

  <main class="container">
    <section id="calculator" class="calculator-card">
      <h2>Car Financing Calculator</h2>
      <p>Enter details to calculate monthly payment and total interest</p>

      <form id="loan-form">
        <div class="input-group">
          <label for="car-price">Car Price:</label>
          <input type="number" id="car-price" placeholder="e.g. 500000" required min="1">
        </div>

        <div class="input-group">
          <label for="down-payment">Down Payment:</label>
          <input type="number" id="down-payment" placeholder="e.g. 100000" required min="0">
        </div>

        <div class="input-group">
          <label for="interest-rate">Annual Interest Rate (%):</label>
          <input type="number" id="interest-rate" step="0.1" placeholder="e.g. 10" required min="0">
        </div>

        <div class="input-group">
          <label for="years">Loan Duration (Years):</label>
          <input type="number" id="years" placeholder="e.g. 5" required min="1" max="10">
        </div>

        <button type="button" onclick="calculateLoan()">Calculate</button>
      </form>

      <div id="results" class="results-card hidden">
        <h3>Calculation Results:</h3>
        <div class="result-item">
          <span>Loan Principal Amount:</span>
          <strong id="loan-amount">0</strong>
        </div>
        <div class="result-item">
          <span>Total Interest:</span>
          <strong id="total-interest">0</strong>
        </div>
        <div class="result-item">
          <span>Total Payable Amount:</span>
          <strong id="total-payment">0</strong>
        </div>
        <div class="result-item highlight">
          <span>Monthly Payment:</span>
          <strong id="monthly-payment">0</strong>
        </div>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
